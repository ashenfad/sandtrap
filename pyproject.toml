[project]
name = "sandtrap"
version = "0.3.4"
description = "Local Python sandbox using AST rewriting, with optional subprocess isolation and kernel-level enforcement."
readme = "README.md"
license = "MIT"
authors = [
    {name = "ashenfad"},
]
keywords = ["sandbox", "security", "ast", "python", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    # 0.1.9: the remaining `pathlib._NormalAccessor` captures on 3.10 are
    # rebound — including an `expanduser` that leaked the host home — and
    # `os.path.realpath(strict=True)` is honoured inside a patched block.
    "monkeyfs>=0.1.9,<0.2.0",
]

[project.urls]
"Homepage" = "https://github.com/ashenfad/sandtrap"
"Bug Tracker" = "https://github.com/ashenfad/sandtrap/issues"
"Documentation" = "https://github.com/ashenfad/sandtrap#readme"
"Source" = "https://github.com/ashenfad/sandtrap"

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pandas",
]
# Kernel mode on LINUX only: seccomp + Landlock bindings. macOS needs nothing
# (Seatbelt ships with the OS), and isolation="process" needs nothing anywhere
# — which is what the old name, [process], kept implying.
kernel = [
    "landlock; sys_platform == 'linux'",
    "pyseccomp; sys_platform == 'linux'",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # The suite still exercises wrapped mode in full, so its own
    # deprecation notice is expected here rather than news. Tests that
    # assert the warning use pytest.warns, which ignores this filter.
    'ignore:mode="wrapped" is deprecated:DeprecationWarning',
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {where = ["./"], exclude = ["tests*"]}}

[tool.setuptools.package-data]
sandtrap = ["py.typed"]

